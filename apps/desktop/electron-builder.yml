appId: io.kiln.desktop
productName: Kiln
copyright: Copyright © Kiln Contributors
asar: true
npmRebuild: false
directories:
  output: release
files:
  - dist/**/*
  - assets/**/*
  - package.json
  - "!node_modules/**"
extraResources:
  - from: runtime
    to: kiln-runtime
mac:
  category: public.app-category.developer-tools
  icon: assets/icon.icns
  artifactName: Kiln-v${version}-darwin-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
        - x64
win:
  icon: assets/icon.ico
  artifactName: Kiln-v${version}-windows-${arch}-setup.${ext}
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
