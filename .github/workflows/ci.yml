name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Run lint, format check, and TypeScript typecheck
        run: |
          pnpm lint
          pnpm fmt:check
          pnpm typecheck

      - name: Run unit and integration tests
        run: pnpm test

      - name: Run socket smoke tests
        run: pnpm test:socket

      - name: Validate install script and POSIX tests
        if: runner.os != 'Windows'
        run: sh -n scripts/install.sh && sh scripts/test-install.sh

      - name: Validate Homebrew formula and cask syntax
        if: runner.os == 'macOS'
        run: ruby -c packaging/homebrew/Formula/kiln.rb && ruby -c packaging/homebrew/Casks/kiln-app.rb
