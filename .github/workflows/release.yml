name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v (e.g. 0.1.0) for dry-run packaging verification"
        required: false
        type: string
      dry_run:
        description: "Verify build, tarballs, and checksums without uploading a release or publishing to npm"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Verify, Package & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, typecheck, test, and validate installer
        run: |
          pnpm build
          pnpm typecheck
          pnpm test
          pnpm test:socket
          sh -n scripts/install.sh
          sh scripts/test-install.sh

      - name: Verify release version matches workspace packages
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eu
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TARGET_VERSION="${GITHUB_REF_NAME#v}"
            IS_TAG_RELEASE="true"
          else
            IS_TAG_RELEASE="false"
            if [ -n "${INPUT_VERSION}" ]; then
              TARGET_VERSION="${INPUT_VERSION#v}"
            else
              TARGET_VERSION="$(node -p "require('./packages/cli/package.json').version")"
            fi
          fi

          export TARGET_VERSION
          node <<'EOF'
          const fs = require("node:fs");
          const target = process.env.TARGET_VERSION;
          if (!/^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/.test(target)) {
            console.error(`Invalid semver release version: ${target}`);
            process.exit(1);
          }

          const manifests = [
            "packages/protocol/package.json",
            "packages/kernel/package.json",
            "packages/mcp/package.json",
            "packages/cli/package.json",
            "apps/web/package.json",
          ];

          for (const manifestPath of manifests) {
            const pkg = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            if (pkg.version !== target) {
              console.error(
                `Version mismatch in ${manifestPath}: expected ${target}, found ${pkg.version}`,
              );
              process.exit(1);
            }
          }
          console.log(`Verified workspace version: ${target}`);
          EOF

          {
            echo "version=${TARGET_VERSION}"
            echo "tag=v${TARGET_VERSION}"
            echo "is_tag_release=${IS_TAG_RELEASE}"
          } >> "${GITHUB_OUTPUT}"

      - name: Package release tarballs and SHA256SUMS
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -eu
          rm -rf release-artifacts
          mkdir -p release-artifacts

          pnpm --filter ./packages/cli pack --pack-destination "${GITHUB_WORKSPACE}/release-artifacts"

          STAGE_DIR="release-artifacts/kiln-${RELEASE_TAG}"
          mkdir -p "${STAGE_DIR}/packages/protocol" "${STAGE_DIR}/packages/kernel" "${STAGE_DIR}/packages/mcp" "${STAGE_DIR}/packages/cli" "${STAGE_DIR}/scripts"
          cp LICENSE README.md README.zh-CN.md package.json pnpm-workspace.yaml pnpm-lock.yaml "${STAGE_DIR}/"
          cp scripts/install.sh "${STAGE_DIR}/scripts/install.sh"
          for pkg in protocol kernel mcp cli; do
            cp "packages/${pkg}/package.json" "${STAGE_DIR}/packages/${pkg}/"
            cp -R "packages/${pkg}/dist" "${STAGE_DIR}/packages/${pkg}/dist"
          done
          cp -R packages/kernel/public "${STAGE_DIR}/packages/kernel/public"
          cp -R packages/cli/mcp "${STAGE_DIR}/packages/cli/mcp"
          cp -R packages/cli/public "${STAGE_DIR}/packages/cli/public"

          tar -czf "release-artifacts/kiln-${RELEASE_TAG}-bundle.tar.gz" -C release-artifacts "kiln-${RELEASE_TAG}"
          rm -rf "${STAGE_DIR}"

          (
            cd release-artifacts
            sha256sum *.tgz *.tar.gz > SHA256SUMS
          )
          cat release-artifacts/SHA256SUMS

      - name: Print Homebrew SHA256 summary and release prerequisites
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          IS_TAG_RELEASE: ${{ steps.version.outputs.is_tag_release }}
        run: |
          set -eu
          {
            echo "## Kiln Release Summary (${RELEASE_TAG})"
            echo ""
            echo "- Mode: \`is_tag_release=${IS_TAG_RELEASE}\`"
            echo "- Artifacts & SHA256SUMS:"
            echo '```text'
            cat release-artifacts/SHA256SUMS
            echo '```'
            echo ""
            echo "### Homebrew Formula Update Notes"
            echo "1. Update \`packaging/homebrew/Formula/kiln.rb\` \`url\` and \`sha256\` in \`zzf2333/homebrew-tap\` using the published tarball hash above."
            echo "2. \`packaging/homebrew/Casks/kiln-app.rb\` (macOS Cask for \`Kiln.app\`) requires signed & notarized macOS DMG release artifacts."
            echo ""
            echo "### Manual / Secrets Prerequisites Before Full Automated Release"
            echo "- Configure \`NPM_TOKEN\` repository secret for automated npm publishing."
            echo "- Configure Apple Developer ID signing & notarization secrets (\`APPLE_CERTIFICATE\`, \`APPLE_CERTIFICATE_PASSWORD\`, \`APPLE_ID\`, \`APPLE_TEAM_ID\`, \`APPLE_APP_SPECIFIC_PASSWORD\`) before publishing signed \`Kiln.app\` DMGs."
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Upload GitHub Release
        if: ${{ steps.version.outputs.is_tag_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: release-artifacts/*

      - name: Publish @zzf2333/kiln to npm
        if: ${{ steps.version.outputs.is_tag_release == 'true' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is not configured; skipping npm publish step. See packaging/README.md for setup details."
            exit 0
          fi

          node <<'EOF'
          const fs = require("node:fs");
          const pkg = JSON.parse(fs.readFileSync("packages/cli/package.json", "utf8"));
          if (pkg.private === true) {
            console.error(
              "packages/cli/package.json still has private: true. Follow packaging/README.md before publishing to npm.",
            );
            process.exit(1);
          }
          if (pkg.name !== "@zzf2333/kiln") {
            console.error(
              `Expected publishable package name @zzf2333/kiln, found ${pkg.name}. Follow packaging/README.md.`,
            );
            process.exit(1);
          }
          EOF

          NPMRC_PATH="${RUNNER_TEMP}/kiln-publish.npmrc"
          trap 'rm -f "${NPMRC_PATH}"' EXIT
          umask 077
          printf '//registry.npmjs.org/:_authToken=%s\n' "${NODE_AUTH_TOKEN}" > "${NPMRC_PATH}"
          NPM_CONFIG_USERCONFIG="${NPMRC_PATH}" npm_config_userconfig="${NPMRC_PATH}" pnpm --filter ./packages/cli publish --no-git-checks --access public
