name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v (e.g. 0.1.0) for dry-run packaging verification"
        required: false
        type: string
      dry_run:
        description: "Verify builds, installers, and checksums without publishing a GitHub Release"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  verify:
    name: Verify Workspace & Version Parity
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_tag_release: ${{ steps.version.outputs.is_tag_release }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, lint, format check, typecheck, test, and validate installer & templates
        run: |
          pnpm build
          pnpm lint
          pnpm fmt:check
          pnpm typecheck
          pnpm test
          pnpm test:socket
          sh -n scripts/install.sh
          sh scripts/test-install.sh
          ruby -c packaging/homebrew/Formula/kiln.rb
          ruby -c packaging/homebrew/Casks/kiln-app.rb

      - name: Verify release version parity across all workspace and desktop manifests
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eu
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TARGET_VERSION="${GITHUB_REF_NAME#v}"
            IS_TAG_RELEASE="true"
          else
            IS_TAG_RELEASE="false"
            if [ -n "${INPUT_VERSION}" ]; then
              TARGET_VERSION="${INPUT_VERSION#v}"
            else
              TARGET_VERSION="$(node -p "require('./packages/cli/package.json').version")"
            fi
          fi

          export TARGET_VERSION
          node <<'EOF'
          const fs = require("node:fs");
          const target = process.env.TARGET_VERSION;
          if (!/^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/.test(target)) {
            console.error(`Invalid semver release version: ${target}`);
            process.exit(1);
          }

          const jsonManifests = [
            "packages/protocol/package.json",
            "packages/kernel/package.json",
            "packages/mcp/package.json",
            "packages/cli/package.json",
            "apps/web/package.json",
            "apps/desktop/package.json",
          ];

          for (const manifestPath of jsonManifests) {
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            if (manifest.version !== target) {
              console.error(
                `Version mismatch in ${manifestPath}: expected ${target}, found ${manifest.version}`,
              );
              process.exit(1);
            }
          }

          console.log(`Verified release version parity across all manifests: ${target}`);
          EOF

          {
            echo "version=${TARGET_VERSION}"
            echo "tag=v${TARGET_VERSION}"
            echo "is_tag_release=${IS_TAG_RELEASE}"
          } >> "${GITHUB_OUTPUT}"

  build-binaries:
    name: Build Standalone Binary (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
            native_smoke: true
            ext: ""
          - os: macos-latest
            target: darwin-x64
            native_smoke: false
            ext: ""
          - os: windows-latest
            target: windows-x64
            native_smoke: true
            ext: ".exe"
          - os: ubuntu-latest
            target: linux-x64
            native_smoke: true
            ext: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies and build Web UI
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Compile standalone Kiln binary (${{ matrix.target }})
        run: node scripts/build-binary.mjs --target ${{ matrix.target }} --version ${{ needs.verify.outputs.version }} --out-dir release-artifacts/bin

      - name: Smoke test standalone binary (POSIX)
        if: ${{ matrix.native_smoke && runner.os != 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          BIN="${GITHUB_WORKSPACE}/release-artifacts/bin/kiln-v${{ needs.verify.outputs.version }}-${{ matrix.target }}"
          TMP_HOME="$(mktemp -d)"
          trap 'rm -rf "${TMP_HOME}"' EXIT
          cp "${BIN}" "${TMP_HOME}/kiln"
          chmod +x "${TMP_HOME}/kiln"
          env -i PATH=/usr/bin:/bin HOME="${TMP_HOME}/home" KILN_HOME="${TMP_HOME}/kiln-home" "${TMP_HOME}/kiln" --version
          env -i PATH=/usr/bin:/bin HOME="${TMP_HOME}/home" KILN_HOME="${TMP_HOME}/kiln-home" "${TMP_HOME}/kiln" up --port 14319 --no-paseo
          curl -fsS http://127.0.0.1:14319/api/health
          curl -fsS http://127.0.0.1:14319/ | grep -qi "<!doctype html"
          env -i PATH=/usr/bin:/bin HOME="${TMP_HOME}/home" KILN_HOME="${TMP_HOME}/kiln-home" "${TMP_HOME}/kiln" down

      - name: Smoke test standalone binary (Windows)
        if: ${{ matrix.native_smoke && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin = Join-Path $env:GITHUB_WORKSPACE "release-artifacts\bin\kiln-v${{ needs.verify.outputs.version }}-windows-x64.exe"
          $tmpRoot = Join-Path ([System.IO.Path]::GetTempPath()) ("kiln-smoke-" + [Guid]::NewGuid().ToString("N"))
          $kilnHome = Join-Path $tmpRoot "kiln-home"
          $kilnLog = Join-Path $kilnHome "logs\kilnd.log"
          New-Item -ItemType Directory -Path $tmpRoot -Force | Out-Null
          try {
            $copied = Join-Path $tmpRoot "kiln.exe"
            Copy-Item -Path $bin -Destination $copied -Force
            $env:KILN_HOME = $kilnHome
            & $copied --version
            if ($LASTEXITCODE -ne 0) { throw "kiln.exe --version failed with exit code $LASTEXITCODE" }
            & $copied up --port 14319 --no-paseo
            if ($LASTEXITCODE -ne 0) { throw "kiln.exe up failed with exit code $LASTEXITCODE" }
            $health = Invoke-WebRequest -Uri "http://127.0.0.1:14319/api/health" -UseBasicParsing
            if ($health.StatusCode -ne 200) { throw "Unexpected health status: $($health.StatusCode)" }
            $root = Invoke-WebRequest -Uri "http://127.0.0.1:14319/" -UseBasicParsing
            if ($root.Content -notmatch "<!doctype html") { throw "Embedded index.html missing" }
            $downOutput = (& $copied down 2>&1 | Out-String)
            Write-Host $downOutput
            if ($LASTEXITCODE -ne 0) { throw "kiln.exe down failed with exit code $LASTEXITCODE" }
            if ($downOutput -notmatch "stopped") { throw "Expected graceful 'kilnd stopped' output from kiln.exe down" }
          } catch {
            if (Test-Path $kilnLog) {
              Write-Host "=== kilnd.log ==="
              Get-Content -LiteralPath $kilnLog -Raw | Write-Host
            }
            throw
          } finally {
            Remove-Item -LiteralPath $tmpRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload standalone binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: release-artifacts/bin/kiln-v${{ needs.verify.outputs.version }}-${{ matrix.target }}${{ matrix.ext }}
          if-no-files-found: error

  build-desktop:
    name: Build Electron Desktop (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
            arch: arm64
          - os: macos-latest
            target: darwin-x64
            arch: x64
          - os: windows-latest
            target: windows-x64
            arch: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies and build workspace + Electron runtime
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Run Electron desktop tests
        run: pnpm --filter @kiln/desktop test

      - name: Build Electron desktop bundle (macOS ${{ matrix.arch }})
        if: runner.os == 'macOS'
        shell: bash
        env:
          RAW_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          RAW_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          RAW_APPLE_ID: ${{ secrets.APPLE_ID }}
          RAW_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RAW_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          set -euo pipefail
          unset CSC_LINK CSC_KEY_PASSWORD CSC_IDENTITY_AUTO_DISCOVERY APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD
          if [ -n "${RAW_APPLE_CERTIFICATE}" ] && [ -n "${RAW_APPLE_CERTIFICATE_PASSWORD}" ]; then
            export CSC_LINK="${RAW_APPLE_CERTIFICATE}"
            export CSC_KEY_PASSWORD="${RAW_APPLE_CERTIFICATE_PASSWORD}"
            if [ -n "${RAW_APPLE_ID}" ] && [ -n "${RAW_APPLE_TEAM_ID}" ] && [ -n "${RAW_APPLE_PASSWORD}" ]; then
              export APPLE_ID="${RAW_APPLE_ID}"
              export APPLE_TEAM_ID="${RAW_APPLE_TEAM_ID}"
              export APPLE_APP_SPECIFIC_PASSWORD="${RAW_APPLE_PASSWORD}"
            fi
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          pnpm --filter @kiln/desktop exec electron-builder --mac dmg --${{ matrix.arch }}

      - name: Build Electron desktop bundle (Windows ${{ matrix.arch }})
        if: runner.os == 'Windows'
        shell: pwsh
        run: pnpm --filter @kiln/desktop exec electron-builder --win nsis --${{ matrix.arch }}

      - name: Collect desktop bundle artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts/desktop
          DMG_SRC="apps/desktop/release/Kiln-v${{ needs.verify.outputs.version }}-${{ matrix.target }}.dmg"
          test -f "${DMG_SRC}"
          cp "${DMG_SRC}" release-artifacts/desktop/

      - name: Collect desktop bundle artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path "release-artifacts/desktop" -Force | Out-Null
          $exe = "apps/desktop/release/Kiln-v${{ needs.verify.outputs.version }}-windows-x64-setup.exe"
          if (-not (Test-Path $exe)) { throw "NSIS installer .exe not found at $exe" }
          Copy-Item -Path $exe -Destination "release-artifacts/desktop/Kiln-v${{ needs.verify.outputs.version }}-windows-x64-setup.exe" -Force

      - name: Upload desktop bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: release-artifacts/desktop/*
          if-no-files-found: error

  publish:
    name: Assemble SHA256SUMS & Publish GitHub Release
    needs: [verify, build-binaries, build-desktop]
    runs-on: ubuntu-latest

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          set -eu
          cd release-artifacts
          LC_ALL=C sha256sum kiln-v* Kiln-v* > SHA256SUMS
          cat SHA256SUMS

      - name: Print Release Summary & Homebrew SHA256 Notes
        env:
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          IS_TAG_RELEASE: ${{ needs.verify.outputs.is_tag_release }}
        run: |
          set -eu
          {
            echo "## Kiln Release Summary (${RELEASE_TAG})"
            echo ""
            echo "- Mode: \`is_tag_release=${IS_TAG_RELEASE}\`"
            echo "- Artifacts & SHA256SUMS:"
            echo '```text'
            cat release-artifacts/SHA256SUMS
            echo '```'
            echo ""
            echo "### Homebrew Formula & Cask Update Notes"
            echo "1. Copy \`kiln-${RELEASE_TAG}-darwin-arm64\`, \`kiln-${RELEASE_TAG}-darwin-x64\`, and \`kiln-${RELEASE_TAG}-linux-x64\` SHA-256 digests into \`packaging/homebrew/Formula/kiln.rb\` and sync to \`zzf2333/homebrew-tap\`."
            echo "2. For signed & notarized macOS DMGs, backfill \`packaging/homebrew/Casks/kiln-app.rb\` SHA-256."
            echo "3. Configure Apple Developer ID secrets (\`APPLE_CERTIFICATE\`, \`APPLE_CERTIFICATE_PASSWORD\`, \`APPLE_ID\`, \`APPLE_TEAM_ID\`, \`APPLE_PASSWORD\`) and Windows Authenticode signing before formal public release."
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Upload GitHub Release
        if: ${{ needs.verify.outputs.is_tag_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          generate_release_notes: true
          files: release-artifacts/*
