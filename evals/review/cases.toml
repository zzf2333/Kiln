review_md = "REVIEW.md"

[[cases]]
id = "R1"
intro = "76aae25aea31307b4fd98bc700c3cba3ba0cbc50"
fix = ["e2ef5c770590acb111a5d7be231ae9bacaa8746e"]
risk = "high"
files = ["packages/cli/src/commands.ts"]
defect = "kiln up --foreground 启用 enableOrchestrator: true 构造 KilndServer 时未创建或注册 PaseoBackend，导致真实启动 kilnd 后 BackendRegistry 为空、无法发现或调度任何 Paseo Agent。"

[[cases]]
id = "R2"
intro = "76aae25aea31307b4fd98bc700c3cba3ba0cbc50"
fix = ["585aeff1bc4891c2cb50009bfb42205804ed0ed4"]
risk = "high"
files = ["packages/kernel/src/server/orchestrator.ts"]
defect = "dispatchPlan 在 backend.start() 返回后仅要求租约 state 为 active，并在 handleBackendStartError 也只认 active 租约；当执行者在 start() 挂起期间已通过 wb_submit_receipt 原子提交回执使租约变为 completed 时，返回后反而取消会话、跳过后续门禁收口，导致任务永久卡死在 running。"

[[cases]]
id = "R3"
intro = "739bfcaf41d1d2aa92182f675bcfc32b09d1c178"
fix = ["585aeff1bc4891c2cb50009bfb42205804ed0ed4"]
risk = "high"
files = ["packages/kernel/src/server/mcp-rpc.ts"]
defect = "handleSubmitReceipt 在调用 store.submitReceipt 原子消费活跃租约并写盘 RECEIPT.md 之前，未按 token 角色校验 markdown 的回执 Schema（parseAndValidateReceipt）及 run_id/contract_version 一致性，导致格式错误的回执直接烧毁单次租约、无法同回合修正重提。"

[[cases]]
id = "R4"
intro = "739bfcaf41d1d2aa92182f675bcfc32b09d1c178"
fix = ["efb11e7d7497a483ee53d29d210d294a8fc00863"]
risk = "high"
files = ["packages/kernel/src/server/daemon.ts"]
defect = "KilndServer.stop() 在调用 sseHub.closeAll() 后紧接着同步调用 server.closeAllConnections() 强掐连接，未待 HTTP server.close() 先优雅排空响应流，导致活跃 SSE 客户端在服务端刷出 chunked 终止块前被断连并报 ERR_INCOMPLETE_CHUNKED_ENCODING。"

[[cases]]
id = "R5"
intro = "739bfcaf41d1d2aa92182f675bcfc32b09d1c178"
fix = ["4c4945e249ea74d01a03746e8c0200532106ab26"]
risk = "medium"
files = ["packages/kernel/src/scheduler/scheduler.ts"]
defect = "KilnScheduler.executeTick() 顶部以 nowMs 检查速率限流并延后候选任务，尾部调用 syncCooldownTimer(this.now()) 却直接用新时间点同步定时器；当被延后任务的冷却恰好在本次 tick 耗时期间过期时，syncCooldownTimer 清除冷却定时器且未置位 dirty，导致延后任务永久卡死在 queued 失去唤醒。"

[[cases]]
id = "R6"
intro = "92de2dd64f266b45dc071b6cd73c2015d995f3b9"
fix = ["810e3c88a2f99c49519ee8a8644d297209af9586"]
risk = "high"
files = ["apps/desktop/src-tauri/src/daemon_client.rs", "apps/desktop/src-tauri/src/tray.rs"]
defect = "Finder 启动下极简 PATH 未补全导致 spawn_kiln_up/run_kiln_down 执行 #!/usr/bin/env node 失败且 resolve_kiln_binary 缺少版本管理器目录扫描，同时 MENU_START_KILND 仅 eprintln 静默吞错导致菜单无任何失败反馈。"

[[cases]]
id = "R7"
intro = "958925261c92c80dd2f8ac67ff3e658d436a0134"
fix = ["bbed1d6780185656680a5b8fae9ed9b2b46fb9c4"]
risk = "medium"
files = ["apps/web/src/state/pricing.ts"]
defect = "computeTaskCostUsd 将整张任务卡跨阶段累计的全部 input/cached/output tokens 直接乘以最后阶段单个 task.model 的单价覆盖 task.cost_usd，导致开启异构审查或多模型执行时看板与用量页单卡费用失真并与总计/详情不一致。"

[[cases]]
id = "R8"
intro = "031cf7acdae814329ac24b8d38d9b282df3ce41f"
fix = ["50d61a02c687e6cf058e785c257c7922fb3e37b6"]
risk = "high"
files = ["packages/kernel/src/server/space-inspect.ts"]
defect = "resolveRevealTargetPath 对 file:// URL 未先校验 hostname 为空或 localhost 即直接调用 fileURLToPath，且未拦截 UNC 网络路径；在 Windows 下 file://evil.example.com/... 会被转为 \\\\evil.example.com\\... 并传入 fs.existsSync，既绕过 400 invalid_path 校验又可能触发对外 SMB 访问。"

[[cases]]
id = "R9"
intro = "739bfcaf41d1d2aa92182f675bcfc32b09d1c178"
fix = ["a7a0b8804ec47371dbd35e3a405b001fadd26427"]
risk = "high"
files = ["packages/kernel/src/server/mcp-rpc.ts"]
defect = "handleAskDecision 未禁止执行阶段 Agent 提交 action='return_external' 的待决选项，导致用户误采纳后将未完成任务切入 external 且缺乏恢复/完结出口而永久停滞。"

[[cases]]
id = "R10"
intro = "c1ad56288d8413a7fdcb2ca64cb83ffc755bc23b"
fix = ["b00b46fc527fbc0ee92553a37f3417020207dddd"]
risk = "high"
files = ["packages/kernel/src/server/orchestrator.ts"]
defect = "全局每日或每月 USD 硬预算熔断在构造 budget_exceeded 待决选项时写入了不在 DecisionActionSchema 枚举内的 action='pause'，导致 PendingDecisionSchema.parse 抛错，使本应挂起在 budget_exceeded 的任务退化为 dispatch_error 并丢失预算恢复选项。"

[[cases]]
id = "R11"
intro = "376f4e1a03b6bc1a5627763b7d4fc819e00bcead"
fix = ["4269e6bcd494ff52724fc9c04636064dc976029e"]
risk = "high"
files = ["packages/kernel/src/backend/codex-app-server.ts"]
defect = "CODEX_MODES 将 read-only 排在首位，而写角色调用的 selectSafeModeId 在找不到 auto/default 时回退 safeModes[0]，导致所有非只读 Codex 执行会话在 sessionRef.meta.modeId 与 RUN.yaml 中被错误标记为 read-only。"

[[cases]]
id = "R12"
intro = "847178e664902778df497d1923a399e13760808b"
fix = ["2cf7efa5e2dba2437b6b04b57e578dd1b93bb386"]
risk = "high"
files = ["packages/kernel/src/gate/host-scoped.ts"]
defect = "matchesSingleHostScopePattern 对不带尾部斜杠或通配符的 host_scoped 白名单路径调用 fs.statSync 判断是否为目录，当契约 scope 指向 Phase 2 才会新建的宿主机目录时因 ENOENT 回退为仅精确匹配单路径，导致目录下所有暂存文件被误判为 out_of_scope_paths。"
